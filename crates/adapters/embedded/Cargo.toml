[package]
name = "ukma-adapter-embedded"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Embedded (file-backed) canonical metadata + durable outbox; FTS/vector are rebuildable projections"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storage-ports = { path = "../../storage-ports" }
ukma-contracts = { path = "../../ukma-contracts" }
