[package]
name = "ukma-adapter-filesystem"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Content-addressed artifact adapter on the local filesystem (§6.2 Artifact)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storage-ports = { path = "../../storage-ports" }
ukma-contracts = { path = "../../ukma-contracts" }
