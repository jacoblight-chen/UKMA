[package]
name = "code-intelligence"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Code Intelligence domain types, parser port (§32.1) and the 38-language registry with honest support levels"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", optional = true }
sha2 = "0.10"
regex = "1"
retrieval-engine = { path = "../retrieval-engine" }
indexing-engine = { path = "../indexing-engine" }
embedding-engine = { path = "../embedding-engine" }
graph-engine = { path = "../graph-engine" }
ukma-contracts = { path = "../ukma-contracts" }
# Pinned to the locked upstream baseline (S2-rust), so the parse substrate is the
# same grammar version CodeGraph used.
# `tree-sitter` is a hard dependency: the parser engine and `grammar_for` are
# always compiled, while the grammars below stay optional. Making the substrate
# optional meant the crate only built when at least one grammar feature was on.
tree-sitter = { version = "=0.25.10" }
tree-sitter-rust = { version = "=0.24.2", optional = true }
# S2 batch 1: versions taken from the locked baseline Cargo.lock
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-c = { version = "=0.24.1", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-clojure = { version = "=0.1.0", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-css = { version = "=0.25.0", optional = true }
tree-sitter-elixir = { version = "=0.3.5", optional = true }
tree-sitter-elm = { version = "=5.9.0", optional = true }
tree-sitter-erlang = { version = "=0.15.0", optional = true }
tree-sitter-fortran = { version = "=0.5.1", optional = true }
tree-sitter-groovy = { version = "=0.1.2", optional = true }
tree-sitter-haskell = { version = "=0.23.1", optional = true }
tree-sitter-hcl = { version = "=1.1.0", optional = true }
tree-sitter-julia = { version = "=0.23.1", optional = true }
# deviation (ADR-049 O-08): the baseline pin tree-sitter-kotlin 0.3.5 links
# against tree-sitter >=0.21,<0.23 and cannot coexist with 0.25.10, so the
# tree-sitter-language based fork is used and recorded in the kotlin ledger.
tree-sitter-kotlin-ng = { version = "=1.1.0", optional = true }
tree-sitter-lua = { version = "=0.5.0", optional = true }
tree-sitter-objc = { version = "=3.0.2", optional = true }
tree-sitter-ocaml = { version = "=0.24.2", optional = true }
tree-sitter-php = { version = "=0.24.2", optional = true }
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-scala = { version = "=0.25.0", optional = true }
tree-sitter-solidity = { version = "=1.2.13", optional = true }
tree-sitter-swift = { version = "=0.7.1", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-verilog = { version = "=1.0.3", optional = true }
tree-sitter-yaml = { version = "=0.7.2", optional = true }

# S2 batch 4: the 7 languages with no grammar in the locked baseline.
# Pinned exactly; every one is a deviation recorded in its ledger slice
# (ADR-049 O-08) because the baseline has no version to match.
bca-tree-sitter-tcl = { version = "=2.4.0", optional = true }
arborium-cobol = { version = "=2.18.2", optional = true }
tree-sitter-containerfile = { version = "=0.9.2", optional = true }
tree-sitter-dart = { version = "=0.1.0", optional = true }
tree-sitter-r = { version = "=1.3.0", optional = true }
tree-sitter-zig = { version = "=1.1.2", optional = true }
ts-parser-perl = { version = "=2.0.0", optional = true }
# OSV online dependency audit (feature `osv`, enabled by `--online`): a
# lightweight blocking HTTP client with TLS. Off by default so the standard
# build stays network-free; only the OSV query path uses it.
ureq = { version = "2", optional = true }

[features]
# Real OSV lookups (network). Off by default; the offline manifest is the
# fallback when off or when the network is unavailable.
osv = ["dep:ureq"]
parser-rust = ["dep:tree-sitter-rust"]
# Emits JSON Schema for the wire types (contract closure, see ADR-058).
schema = ["dep:schemars"]
default = [
    "parser-rust",
    "parser-s2-batch1",
    "parser-s2-batch2",
    "parser-s2-batch4",
]
parser-s2-batch1 = [
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
]


parser-s2-batch2 = [
    "dep:tree-sitter-clojure",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-elm",
    "dep:tree-sitter-erlang",
    "dep:tree-sitter-fortran",
    "dep:tree-sitter-groovy",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-hcl",
    "dep:tree-sitter-julia",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-objc",
    "dep:tree-sitter-ocaml",
    "dep:tree-sitter-php",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-solidity",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-verilog",
    "dep:tree-sitter-yaml",
]

parser-s2-batch4 = [
    "dep:bca-tree-sitter-tcl",
    "dep:arborium-cobol",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-containerfile",
    "dep:ts-parser-perl",
    "dep:tree-sitter-r",
    "dep:tree-sitter-zig",
]

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"
