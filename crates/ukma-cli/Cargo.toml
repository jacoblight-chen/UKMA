[package]
name = "ukma-cli"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Command-line client over the public API."

[[bin]]
name = "ukma"
path = "src/main.rs"

[features]
# Enables the real ONNX Runtime path (off by default).
onnx = ["ukma-mcp/onnx"]
# Enables the real OSV dependency audit (off by default; `--online`).
osv = ["ukma-mcp/osv"]

[dependencies]
code-intelligence = { path = "../code-intelligence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storage-ports = { path = "../storage-ports" }
ukma-adapter-sqlite = { path = "../adapters/sqlite" }
ukma-contracts = { path = "../ukma-contracts" }
ukma-mcp = { path = "../ukma-mcp" }
ureq = { version = "2", features = ["json"] }
