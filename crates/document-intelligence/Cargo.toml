[package]
name = "document-intelligence"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Document Intelligence domain: parsers (MD/PDF text layer/DOCX) and the 14 operations (DAPI-01..14)."

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
indexing-engine = { path = "../indexing-engine" }
ukma-contracts = { path = "../ukma-contracts" }
# PDF text layer (no OCR) and DOCX container parsing.
lopdf = "0.36"
quick-xml = "0.37"
zip = "2"

[dev-dependencies]
sha2 = "0.10"
zip = "2"
lopdf = "0.36"
