[package]
name = "ukma-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "MCP/REST gateway: registry-driven dispatch of 65 domain + 4 system operations."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ukma-contracts = { path = "../ukma-contracts" }
code-intelligence = { path = "../code-intelligence" }
document-intelligence = { path = "../document-intelligence" }
memory-domain = { path = "../memory-domain" }
traceability-engine = { path = "../traceability-engine" }
