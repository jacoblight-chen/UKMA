[package]
name = "ukma-contract-check"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Contract-closure validator for UKMA v1.2.3 (registry, schemas, fixtures, drift)"

[dependencies]
jsonschema = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ukma-contracts = { path = "../ukma-contracts" }
