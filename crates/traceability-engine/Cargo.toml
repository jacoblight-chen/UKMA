[package]
name = "traceability-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Traceability domain: canonical trace types, the TraceLink state machine, three-dimensional validity, coverage/impact/gap/explain analysis and the 13 operations (TAPI-01..13)."

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ukma-contracts = { path = "../ukma-contracts" }

[dev-dependencies]
serde_json = "1"
