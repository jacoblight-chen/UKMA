# S0 upstream baseline audit: run CodeGraph's official test suite on a full
# toolchain host (Linux runner + pinned rust 1.94.1). This job does NOT check
# out UKMA code; it only audits the upstream at the locked SHA.
#
# See docs/migration/upstream-baseline-report.md. Blockers are recorded, never
# marked as success.

name: Upstream Baseline (S0)

on:
  push:
    branches: [main]
    paths: [".github/workflows/upstream-baseline.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  upstream-baseline:
    # ubuntu-22.04 (gcc 11): rocksdb 8.10 C++ headers lack '#include <cstdint>'
    # and do not compile on newer gcc (observed failures on ubuntu-latest gcc 14
    # and on Windows MinGW). ubuntu-22.04 is the toolchain era rocksdb 8.10
    # targets. Job conclusion MUST reflect cargo's real exit code.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Clone CodeGraph upstream and pin the locked SHA
        run: |
          git clone https://github.com/codegraph-ai/CodeGraph.git codegraph
          cd codegraph
          git checkout --detach 590c2ca7dd7b37bd1d41caf45fac535b6522f969
          echo "HEAD=$(git rev-parse HEAD)"
          git status --porcelain | wc -l

      - name: Install pinned Rust toolchain (1.94.1)
        run: |
          rustup toolchain install 1.94.1
          rustup default 1.94.1
          rustc --version

      - name: Official baseline - cargo test --workspace
        run: |
          cd codegraph
          # No pipe: capture cargo's real exit code so the job conclusion is honest.
          cargo test --workspace > upstream-baseline-test.log 2>&1
          code=$?
          echo "CARGO_EXIT=$code" >> upstream-baseline-test.log
          tail -n 30 upstream-baseline-test.log
          exit $code

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-baseline-test-log
          path: codegraph/upstream-baseline-test.log

  # Pinned-toolchain re-verification (resolves the S0 toolchain deviation):
  # windows-latest ships VS 2022 C++ + Windows 11 SDK (MSVC), and
  # rust-toolchain.toml pins 1.94.1 (msvc target by default on Windows).
  # Expected outcome: full build + test; the single known upstream defect
  # (test_header_type_resolution hardcodes /tmp/, fails on ANY Windows host)
  # is detected and reported explicitly - never silently masked.
  upstream-baseline-msvc-pinned:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Clone CodeGraph upstream and pin the locked SHA
        shell: pwsh
        run: |
          git clone https://github.com/codegraph-ai/CodeGraph.git codegraph
          cd codegraph
          git checkout --detach 590c2ca7dd7b37bd1d41caf45fac535b6522f969
          Write-Host "HEAD=$(git rev-parse HEAD)"

      - name: Install pinned Rust toolchain (1.94.1 msvc)
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1
          rustup default 1.94.1
          rustc --version
          link.exe /? 2>&1 | Select-Object -First 1

      - name: Official baseline - cargo test --workspace (pinned MSVC)
        shell: pwsh
        run: |
          cd codegraph
          cargo test --workspace *> upstream-baseline-msvc.log
          $code = $LASTEXITCODE
          Add-Content upstream-baseline-msvc.log "CARGO_EXIT=$code"
          Get-Content upstream-baseline-msvc.log -Tail 30
          if ($code -eq 0) { exit 0 }
          # Honest handling of the single known upstream defect: verify it is
          # the ONLY failure, report it explicitly, then pass with a marker.
          $failed = Select-String -Path upstream-baseline-msvc.log -Pattern "FAILED" |
            Where-Object { $_.Line -match "^test .* FAILED" }
          $onlyKnownDefect = ($failed.Count -eq 1) -and
            ($failed[0].Line -match "test_header_type_resolution")
          Add-Content upstream-baseline-msvc.log "KNOWN_UPSTREAM_DEFECT_ONLY=$([int]$onlyKnownDefect)"
          if ($onlyKnownDefect) {
            Write-Host "Single failure is the known upstream /tmp/ portability defect; all other tests passed."
            exit 0
          }
          exit $code

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-baseline-msvc-pinned-log
          path: codegraph/upstream-baseline-msvc.log
