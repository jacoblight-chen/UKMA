[package]
name = "ukma-release-evidence"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Derives the licence inventory, CycloneDX SBOM and SBOM digest, and signs/verifies the digest (ADR-059)."

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
