# UKMA Phase 7 S0 — Upstream Cargo Dependency Graph (feature/dependency audit)
# Exported via actually executed command (2026-10-25) at the locked reference SHA.
# Full machine-readable artifact (5.1 MB JSON):
#   f:\codegraph-workspace\upstream-cargo-metadata.json  (cargo metadata --locked --format-version 1)

export:
  command: "cargo metadata --locked --format-version 1"
  working_dir: "f:\\codegraph-workspace\\codegraph-reference"
  full_artifact: "f:\\codegraph-workspace\\upstream-cargo-metadata.json"
  exit_code: 0
  note: >
    `--locked` verified the committed upstream Cargo.lock is consistent with
    workspace manifests (exit 0, no lockfile drift at the locked SHA).

workspace:
  members: 43
  edition: "2021 (all 43 members)"
  resolver: "2"
  breakdown:
    graph_engine: 1 (codegraph)
    parser_api: 1 (codegraph-parser-api)
    language_parsers: 38
    memory_layer: 1 (codegraph-memory)
    server: 1 (codegraph-server)
    test_harness: 1 (codegraph-harness)

rust_features:
  codegraph:
    default: ["rocksdb-backend"]
    rocksdb-backend: ["dep:rocksdb"]
    optional_dependencies: [rocksdb]
    implication: >
      RocksDB is an OPTIONAL dependency but ON by default. Combined with the
      upstream packaging defect (test suite + examples call CodeGraph::open
      unconditionally, no #[cfg(feature = "rocksdb-backend")] gate), the test
      suite cannot build with --no-default-features for tests that require the
      storage backend. UKMA S1 must gate persistence-backend tests explicitly.
  codegraph-parser-api: {}        # no features
  language_parsers: "38 crates; no feature definitions observed at locked SHA (per-crate features not material in the audit; see full JSON)"

external_dependencies:
  unique_count: 71
  notable:
    storage: [rocksdb (2 workspace crates), bincode, rmp-serde, serde (43), serde_json (43), serde_yaml]
    concurrency: [rayon (37), dashmap (2), parking_lot, tokio (2), tokio-test (2)]
    parsing: [tree-sitter (38), tree-sitter-language (10), 37 individual tree-sitter-<lang> grammars]
    embeddings: [fastembed (2), hf-hub, safetensors, half, tokenizers, instant-distance]
    build_support: [cc (10)]
    dev_test: [criterion (18), tempfile (42), thiserror (42), tokio-test]
    server: [tower-lsp (1), tracing (2), tracing-subscriber, notify, walkdir (2), ureq, which, zip, sysinfo, clap (2), globset, regex (2), log (2), anyhow (2), chrono, uuid (2), lru, instant-distance]
  full_list: "see upstream-cargo-metadata.json (packages[].dependencies, 71 unique external names)"

feature_gating_conclusions:
  - "rocksdb-backend is the only feature in the graph/parser core crates (codegraph); default ON"
  - "parser crates depend on codegraph-parser-api (no features) + their tree-sitter grammar (optional dep per parser)"
  - "UKMA Database-Agnostic rule: the rocksdb dep is feature-gated upstream, so the S1 GraphStore Port can expose backends without coupling UKMA contracts to RocksDB"
