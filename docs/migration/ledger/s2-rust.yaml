license:
  identified: true
  notices_preserved: true
  note: Apache-2.0 per docs/migration/license-audit.md
changes:
- id: S2-rust-C1
  kind: port
  detail: >-
    Native re-implementation of the upstream symbol/edge extractor as a
    tree-sitter CST walker (`Extractor`) instead of an upstream AST visitor.
    Same grammar versions as the locked baseline
    (tree-sitter 0.25.10, tree-sitter-rust 0.24.2, from the upstream Cargo.lock),
    so the parse trees are byte-identical.
- id: S2-rust-C2
  kind: adaptation
  detail: >-
    Qualified names are module-scoped (`<file module>::<item>`) so two files that
    declare the same type cannot collide in the graph. Upstream used bare
    identifiers; this is additive information, not a changed algorithm.
- id: S2-rust-C3
  kind: adaptation
  detail: >-
    Reference edges are resolved in a second pass after every symbol in the file
    is known, so the result no longer depends on declaration order. Upstream
    emitted edges during traversal; the resolution semantics (never claim more
    than the evidence) are preserved.
- id: S2-rust-C4
  kind: omission
  detail: >-
    Cross-file/cross-crate name resolution, macro expansion and lifetime/type
    inference are out of scope for this slice; call edges are therefore
    `static_possible` at best and never `static_exact`.
behavior:
  preserved:
  - symbol identity (module/type/function/method/const/static/type)
  - source spans (1-based lines, half-open byte ranges)
  - containment edges (`defines`) as static_exact
  - call edges as static_possible / unresolved, deduplicated per (source, target)
  - import edges as unresolved
  - diagnostics on unparsable input, never an empty document
  - deterministic output for identical input
  intentional_breaking: []
required_behaviour:
- symbol identity (module/type/function/method)
- source spans (1-based lines, 0-based bytes)
- call edges with static_exact/static_possible/unresolved
- import/dependency edges
- diagnostics on unparsable input (never an empty document)
tests:
  golden: crates/code-intelligence/tests/s2_rust_parity.rs (10 tests, passing)
  fixture: crates/code-intelligence/tests/golden/s2-rust/sample.rs
  contract: crates/code-intelligence/tests/s2_coverage.rs
  integration: pending (P3-WP3 ingestion pipeline)
status:
  grammar_ported: true
  parity_report: passed
  parity_scope: >-
