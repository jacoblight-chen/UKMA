  - crates/codegraph-rust/src/mapper.rs
  - crates/codegraph-rust/src/parser_impl.rs
  - crates/codegraph-rust/src/visitor.rs
  - crates/codegraph-rust/tests/integration_tests.rs
  file_count: 7
target:
  repository: ukma
  crate: code-intelligence
  files:
  - crates/code-intelligence/src/lib.rs
  - crates/code-intelligence/src/parsers/mod.rs
  - crates/code-intelligence/src/parsers/rust.rs
  - crates/code-intelligence/tests/s2_rust_parity.rs
