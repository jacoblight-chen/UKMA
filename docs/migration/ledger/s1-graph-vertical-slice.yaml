license:
  identified: true            # Apache-2.0 (upstream LICENSE, full text at locked SHA)
  notices_preserved: true    # attribution preserved in src/lib.rs header; license-audit.md records per-file SPDX headers
  spdx_headers_preserved: true
changes:
  # Full detail in source-map.yaml s1_changes; summary:
  - canonical string ids instead of vendor u64 counters (ADR-031 D1)
  - GraphStore port is scope-keyed (tenant/project) with capability probes (ADR-022)
  - errors map to registered v1.2.3 codes only (no invented wire codes)
  - get_neighbors / SCC output sorted (determinism; upstream order was hash-dependent, never contractual)
  - traversal bounded (max_nodes/max_paths -> RESOURCE_LIMIT; PROP-03)
  - revision + etag optimistic concurrency (Phase 6R pattern)
  - per-scope idempotency keys on add_node/add_edge
  - snake_case wire names (ADR-031 D3; v1 addition — no graph ops exist in the 65-op registry, so no API semantics change)
  - scope validation (non-empty tenant/project -> INVALID_ARGUMENT)
  - UKMA-original FileGraphStore (JSON file adapter, development-only; NOT a port — no upstream counterpart): StoreInner/Snapshot factored into state.rs shared by both adapters
behavior:
  preserved:
    - bfs: start node excluded from results, depth-limited, visited-set deduplication
    - dfs: visited-set deduplication, depth-limited
    - Tarjan SCC: algorithm + len>1 filter (singleton SCCs excluded)
    - find_all_paths: simple paths only (per-path visited set), depth-bounded
    - delete_node cascades to incident edges
    - PropertyMap builder pattern + strongly-typed PropertyValue bag (8 variants)
    - 8 NodeType / 12 EdgeType / 3 Direction variant sets
  intentional_breaking: []    # no upstream behavior is broken; only recorded UKMA-mandated additions
tests:
  golden: "tests/golden/graph-basic-ops.golden.json — VALIDATED by crates/graph-engine/tests/crud_contract.rs::golden_fixture_basic_ops_parity (node_count=2, edge_count=1, exactly one outgoing neighbor, missing ops -> typed NotFound)"
  contract: "EXECUTED (2026-10-25, stable-x86_64-pc-windows-gnu 1.99.1): 53/53 contract tests passed across ids (7), crud (11, incl. golden), traversal (9), tenant_isolation (8), versioning (8), persistence (10: flush/reload, no-flush non-persistence, delete persistence, corrupt/unsupported-file graceful failure, traversal-after-reload, adapter equivalence)"
  integration: "workspace gate: cargo test --workspace --all-targets = 66/66 passed (ukma-code-runtime 9, ukma-contracts 4, graph-engine 53)"
  rust_cargo: "FULL GATE GREEN (2026-10-25): cargo fmt --all -- --check = exit 0; cargo check --workspace --all-targets = exit 0; cargo clippy --workspace --all-targets -- -D warnings = exit 0; cargo test --workspace --all-targets = exit 0 (66/66)"
