  commit: 590c2ca7dd7b37bd1d41caf45fac535b6522f969
  crate: crates/codegraph-dockerfile
  paths:
  - crates/codegraph-dockerfile/build.rs
  - crates/codegraph-dockerfile/src/extractor.rs
  - crates/codegraph-dockerfile/src/lib.rs
  - crates/codegraph-dockerfile/src/mapper.rs
  - crates/codegraph-dockerfile/src/parser_impl.rs
  - crates/codegraph-dockerfile/src/ts_dockerfile.rs
  - crates/codegraph-dockerfile/src/visitor.rs
  - crates/codegraph-dockerfile/tests/dump_ast.rs
  - crates/codegraph-dockerfile/tests/fixture_dockerfile.rs
  file_count: 9
target:
  repository: ukma
  crate: code-intelligence
  files:
  - crates/code-intelligence/src/lib.rs
  - crates/code-intelligence/src/parsers/dockerfile.rs (to be created)
license:
  identified: true
  notices_preserved: true
  note: Apache-2.0 per docs/migration/license-audit.md
changes:
- id: S2-dockerfile-C1
  kind: port
  detail: >-
    Native extraction through the shared generic tree-sitter engine
    (crates/code-intelligence/src/parsers/engine.rs) specialised by the dockerfile
    spec in crates/code-intelligence/src/parsers/spec.rs. Grammar
    tree-sitter-containerfile 0.9.2. Coverage: one symbol per build stage (FROM), because a Dockerfile declares no code symbols; the baseline has no Dockerfile grammar, so this pinned containerfile grammar is the deviation.
- id: S2-dockerfile-C2
  kind: deviation
  detail: >-
    DEVIATION (ADR-049 O-08): the locked baseline Cargo.lock contains no grammar
    for this language, so the version above is a pinned non-baseline crate
    instead of a baseline match. It is ABI-compatible with tree-sitter 0.25.10
    through tree-sitter-language, and the parity claim is measured against this
    fixture rather than against upstream behaviour.
- id: S2-dockerfile-C3
  kind: adaptation
  detail: >-
    Qualified names are module scoped (<file module>::<item>) and a function
    declared inside a type is promoted to Method, so every ported language emits
    the same output shape.
- id: S2-dockerfile-C4
  kind: omission
  detail: >-
    Cross-file/cross-crate name resolution, macro expansion and type inference
    are out of scope; call edges are therefore static_possible at best and never
    static_exact.
behavior:
  preserved:
  - symbol identity (module/type/function/method)
  - source spans (1-based lines, half-open byte ranges)
  - containment edges (defines) as static_exact, deduplicated per (parent, child)
  - call edges as static_possible / unresolved, deduplicated per (source, target)
  - import edges as unresolved
  - diagnostics on unparsable input, never an empty document
  - deterministic output for identical input
  intentional_breaking: []
required_behaviour:
- symbol identity (module/type/function/method)
- source spans (1-based lines, 0-based bytes)
- call edges with static_exact/static_possible/unresolved
- import/dependency edges
- diagnostics on unparsable input (never an empty document)
tests:
  golden: crates/code-intelligence/tests/s2_languages.rs (8 shared parity tests, passing)
  fixture: crates/code-intelligence/tests/golden/s2-dockerfile/sample.dockerfile
  contract: crates/code-intelligence/tests/s2_coverage.rs
  integration: pending (P3-WP3 ingestion pipeline)
status:
  grammar_ported: true
  parity_report: passed
  parity_scope: >-
    Symbol identity, 1-based spans, and containment/import/call edge kinds and
    resolutions over the golden fixture. Not a claim of cross-file resolution.
  blocked_reason: null
review:
  owner: jacoblight-chen
  status: approved
  evidence: cargo test -p code-intelligence --test s2_languages
