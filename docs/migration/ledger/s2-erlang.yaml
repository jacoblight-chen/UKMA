  note: Apache-2.0 per docs/migration/license-audit.md
changes:
- id: S2-erlang-C1
  kind: port
  detail: >-
    Native extraction through the shared generic tree-sitter engine
    (crates/code-intelligence/src/parsers/engine.rs) specialised by the erlang
    spec in crates/code-intelligence/src/parsers/spec.rs. Grammar
    tree-sitter-erlang 0.15.0 (locked-baseline version). Coverage: fun_decl functions, module attribute and records; no call edges extracted in this slice.
- id: S2-erlang-C2
  kind: adaptation
  detail: >-
    Qualified names are module scoped (<file module>::<item>) and a function
    declared inside a type is promoted to Method, so every ported language emits
    the same output shape.
- id: S2-erlang-C3
  kind: omission
  detail: >-
    Cross-file/cross-crate name resolution, macro expansion and type inference
    are out of scope; call edges are therefore static_possible at best and never
    static_exact.
behavior:
  preserved:
  - symbol identity (module/type/function/method)
  - source spans (1-based lines, half-open byte ranges)
  - containment edges (defines) as static_exact, deduplicated per (parent, child)
  - call edges as static_possible / unresolved, deduplicated per (source, target)
  - import edges as unresolved
  - diagnostics on unparsable input, never an empty document
  - deterministic output for identical input
  intentional_breaking: []
required_behaviour:
- symbol identity (module/type/function/method)
- source spans (1-based lines, 0-based bytes)
- call edges with static_exact/static_possible/unresolved
- import/dependency edges
- diagnostics on unparsable input (never an empty document)
