# UKMA S10 Migration Ledger — `pro.security_orchestrated_scan` + `pro.security_codeql_warmup` (PRO-28/29)
# Template per docs/migration/ledger/s9-find-importers.yaml.
# This slice closes the last two CodeGraph security-tool parity gaps
# identified in the Phase 8 re-audit (54 upstream tools, 2 with no UKMA
# counterpart: `security_orchestrated_scan` and `security_codeql_warmup`)
# with two new `pro`-domain operations.
#
# This slice is UKMA-NATIVE: no upstream source was copied. The upstream
# reference consulted (harness case + profile stubs only; the `codegraph-pro`
# binary that implements the two tools is NOT part of the reference checkout)
# is recorded under `upstream` for traceability only.

