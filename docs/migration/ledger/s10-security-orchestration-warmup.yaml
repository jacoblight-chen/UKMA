    # only the harness case + profile stubs were available.
    - "f:\\codegraph-workspace\\codegraph-reference\\crates\\codegraph-harness\\src\\profiles.rs (tool ids)"
    - "f:\\codegraph-workspace\\codegraph-reference\\crates\\codegraph-harness\\cases\\security_orchestrated_scan (harness case: args scope/engines/severity; output analyzer/engines/total/actionable/findings/reachability/path_filter/agreement_distribution)"
  note: >-
    No upstream source was migrated in this slice. The CodeGraph reference
    checkout was consulted to understand the two tools' contracts only.
    `security_orchestrated_scan` runs all detectors and rolls up the findings
    (analyzer "orchestrated", per-engine findings_pre_merge, severity gate,
    path filter, agreement_distribution, reachability). `security_codeql_warmup`
    warms a CodeQL database. The UKMA-native equivalent pre-builds the indexed
    corpus and reports its shape and readiness. Both implementations in this
    slice are original UKMA code.
