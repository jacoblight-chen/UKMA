changes:
- id: S2-c-C1
  kind: port
  detail: >-
    Native extraction through the shared generic tree-sitter engine
    (crates/code-intelligence/src/parsers/engine.rs) specialised by the
    c spec in crates/code-intelligence/src/parsers/spec.rs. Grammar
    version tree-sitter-c 0.24.1 is the locked-baseline version from the
    upstream Cargo.lock, so the parse trees match the baseline.
- id: S2-c-C2
  kind: adaptation
  detail: >-
    Qualified names are module scoped (<file module>::<item>) and methods are
    promoted from free functions when declared inside a type, so the output
    shape is identical across all ported languages.
- id: S2-c-C3
  kind: omission
  detail: >-
    Cross-file/cross-crate name resolution, macro expansion and type inference
    are out of scope; call edges are therefore static_possible at best and
    never static_exact.
behavior:
  preserved:
  - symbol identity (module/type/function/method)
  - source spans (1-based lines, half-open byte ranges)
  - containment edges (defines) as static_exact
  - call edges as static_possible / unresolved, deduplicated per (source, target)
  - import edges as unresolved
  - diagnostics on unparsable input, never an empty document
  - deterministic output for identical input
  intentional_breaking: []
covered: function/struct/enum declarations with declarator-based names, include and call edges
required_behaviour:
- symbol identity (module/type/function/method)
- source spans (1-based lines, 0-based bytes)
- call edges with static_exact/static_possible/unresolved
- import/dependency edges
- diagnostics on unparsable input (never an empty document)
