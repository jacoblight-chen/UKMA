- id: P2
  name: Shared Core 引擎
  status: done
  work_packages:
  - id: P2-WP1
    status: done
    evidence: '?7.2 facade in graph-engine/src/query.rs: upsert_batch (rejects dangling edges before writing), get_entity/get_relation (unauthorized => None, existence not leaked), traverse_bounded (depth/node/edge bounds => RESOURCE_LIMIT, per-hop Authorizer, visited_count counts only authorized nodes), find_paths excluding hidden nodes, query_relations with filters; 8 tests'
    blocked_reason: null
  - id: P2-WP2
    status: done
    evidence: FullTextPort BM25 (k1=1.5, b=0.75 per 29.2) with analyzer-versioned indexes and deterministic (score desc, id asc) ordering; 3 contract tests; RE-002 maths pinned
    blocked_reason: null
  - id: P2-WP3
    status: done
    evidence: HNSW ANN in retrieval-engine/src/hnsw.rs with the registered profile (M=16, m0=32, ef_construction=200, ef_search=64), deterministic seeded level sampling, tombstone deletes, recall@10 >= 0.90 vs brute force, L2 as negated distance; plus HnswVectorStore serving VectorPort (13 index tests + 5 port tests)
    blocked_reason: null
  - id: P2-WP4
    status: done
    evidence: 'retrieval-engine: RRF (k=60, ranks from 1), weighted RRF with weight validation, recency exp(-0.05*d), lang_match 1.0/0.85/0.425, omega_align min(1,a/0.85), final score exponents 1.0/0.5/0.8/0.2/0.6 with NaN/negative rejection, PPR (a=0.6, max_iter=200, L1<1e-6, dangling re-injection, hub dampening), 5-strategy planner with partial reporting, calibrated-relevance detail tiers; 13 tests'
    blocked_reason: null
  - id: P2-WP5
    status: done
    evidence: 'embedding-engine: ModelProfile with all ?7.4 registry fields (digest, tokenizer, dimension, metric, normalization, language support, privacy policy), ModelRegistry rejecting dimension/metric drift (MODEL_PROFILE_MISMATCH), EmbeddingPort/RerankerPort, UnavailableEmbedder returning MODEL_UNAVAILABLE, and an explicitly non-semantic HashEmbedder test double; 8 tests'
    blocked_reason: null
  - id: P2-WP6
    status: done
    evidence: 'indexing-engine: 8-stage ingestion FSM, orthogonal execution/commit/projection outcome (40.4), cancel only before commit, projection-failure keeps the commit and stays retryable, generation pointer with retention + strict_generation lookup; 8 tests'
    blocked_reason: null
  - id: P2-WP7
    status: done
    evidence: 'context-engine: single budget algorithm (C_usable + B_eff + allocation + compression stages) proven against the six 40.2 golden vectors, 3-level folding with exact 0.3/0.7 boundaries and R1-R8 preservation, 22-feature vector with missing mask, T_fold trust decay, deterministic + shadow-RL eviction, integrity/ACL/revision-checked paging; 25 tests'
    blocked_reason: null
- id: P3
  name: Code Intelligence 13 ops
  status: in_progress
  work_packages:
