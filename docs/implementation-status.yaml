    status: in_progress
    evidence: 'ParserPort + 38-language registry plus the S2 migration infrastructure (38 ledger slices with upstream paths/SHA/license, docs/migration/s2-parity-report.yaml, tests/s2_coverage.rs which fails if a language claims Ported without grammar_ported + parity=passed + an existing golden fixture/test). 1/38 grammars ported: rust, on the locked-baseline grammar versions tree-sitter 0.25.10 / tree-sitter-rust 0.24.2, extractor crates/code-intelligence/src/parsers/rust.rs, 10 passing golden parity tests in tests/s2_rust_parity.rs over tests/golden/s2-rust/sample.rs. Parity scope: symbol identity + 1-based spans + containment/import/call edge kinds and resolutions; cross-file resolution, macro expansion and type inference are NOT covered, so call edges are never static_exact. Remaining: 37 languages.'
    blocked_reason: null
  - id: P3-WP2
    status: done
