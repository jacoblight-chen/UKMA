    evidence: 'crates/memory-domain/src/jobs.rs: the nine registered job kinds, tenant partition, idempotent submission per tenant+kind+key, lease with fencing tokens (an expired lease may be taken over, a stale token cannot complete or fail), exponential backoff 5s*2^(n-1) to MAX_ATTEMPTS=5 then dead letter, resume_checkpoint for restart, and the hourly fsrs_refresh interval. Tests: jobs::tests (6). NOTE: the primitives are wired to the pipeline and sweeps but no background worker loop is started by this build (ADR-052 gap 1).'
    blocked_reason: null
  - id: P6-WP8
    status: done
    evidence: 'crates/memory-domain/src/entropy.rs: compression candidates require 0.3<=R<0.7 and gzip_ratio<0.4, empty payloads report SKIPPED_EMPTY, and verify() rolls the attempt back when key content or source references are lost or when the token count did not shrink. Tests: entropy::tests (3) plus fsrs::tests for the gzip ratio itself. NOTE: the entropy_candidate_scan job does not yet drive the rewrite (ADR-052 gap 9).'
    blocked_reason: null
  - id: P6-WP9
    status: done
    evidence: 'MemoryService now implements all 25 §37 operations: MAPI-10 propose_fact, MAPI-11 verify_fact, MAPI-12 find_conflicts, MAPI-18 consolidate, MAPI-19 get_consolidation_job, MAPI-20 register_procedure_candidate, MAPI-21 review_procedure, MAPI-22 record_procedure_outcome are real behaviours, and the FractalMemoryPort no longer returns CAPABILITY_UNAVAILABLE anywhere (ADR-052 supersedes ADR-051 D-09). Tests: tests/p6_matrix.rs (13) covering positive/negative/authorization/cross-scope/version/quarantine paths plus the port delegation test in tests/mapi_matrix.rs.'
    blocked_reason: null

- id: P7
  name: Traceability
  status: done
  work_packages:
  - id: P7-WP1
    status: done
    evidence: 'crates/traceability-engine/src/link.rs: the full §35.2 transition matrix (proposed->validated->accepted, proposed/validated->rejected, validated/accepted->stale, stale->validated, any non-terminal->revoked), rejected/revoked terminal, evidence immutable after acceptance (append_evidence is LINK_STATE_CONFLICT once accepted) with duplicate evidence ids collapsed. Tests: link::tests::the_transition_matrix_is_the_registered_one (11 allowed + 8 refused), evidence_is_immutable_after_acceptance, tapi_matrix tapi02/tapi03/tapi04.'
    blocked_reason: null
  - id: P7-WP2
    status: done
    evidence: 'ValidityVector with independent historical_validity / current_applicability / index_freshness dimensions (§40.3). A new source head sets current_applicability=requires_revalidation while historical_validity stays valid; a revoked verified link also keeps valid history and becomes not_applicable; unknown heads yield unknown. observe_endpoint records a head and moves affected links to stale, recomputing the vector. Tests: link::tests::historical_validity_is_not_changed_by_a_new_head / applicability_covers_unknown_and_terminal_links, tapi_matrix tapi07_a_stale_link_becomes_unknown_not_covered.'
    blocked_reason: null
  - id: P7-WP3
    status: done
    evidence: 'crates/traceability-engine/src/analysis.rs coverage(): denominator is the authorised in-scope requirements, only applicable+index-usable validated/accepted links count as covered, unknown is never covered, denominator=0 yields coverage_ratio=None (never 100%), and any excluded or unknown requirement sets coverage_incomplete. Tests: analysis::tests::coverage_counts_only_applicable_verified_links / an_empty_denominator_has_no_ratio / stale_or_lagging_links_become_unknown_not_covered / accepted_only_ignores_validated_links, tapi_matrix tapi07_* (no false 100%).'
    blocked_reason: null
  - id: P7-WP4
    status: done
    evidence: 'TraceImpact via bounded BFS (max_depth 1..=10, 5000-candidate cap -> RESOURCE_LIMIT) that stops at requires_revalidation edges and reports unknown_due_to_stale with completeness=partial; GapReport (missing_implementation, missing_tests, stale_links, unverifiable, coverage_incomplete); EvidenceReport with contradicted>supported>insufficient, omitted_due_to_access and CONTEXT_BUDGET_EXCEEDED. Tests: analysis::tests impact/gaps/explain (5), tapi_matrix tapi08/tapi09/tapi11.'
    blocked_reason: null
  - id: P7-WP5
    status: done
    evidence: 'All 13 operations implemented on TraceabilityService (TAPI-01 propose_link .. TAPI-13 get_revalidation_job) plus the §37 async TraceabilityPort with all 13 methods. compare_revisions diffs recorded snapshots (added/changed/removed, unknown snapshot -> SOURCE_UNAVAILABLE); revalidate_stale revalidates only when the asserted revision matches the observed head and keeps stale links stale otherwise (never auto-accept). Tests: tests/tapi_matrix.rs 18 covering positive/negative/authorization/cross-tenant/version/terminal-state/job paths and the port. NOTE: no persistence adapter and revalidation runs synchronously (ADR-053 gaps 1-2).'
    blocked_reason: null

- id: P8
  name: Gateway MCP/REST/SDK/CLI/Server
  status: done
  work_packages:
  - id: P8-WP1
    status: done
    evidence: 'crates/ukma-mcp/src/gateway.rs: registry-driven dispatch only (no second table); version/operation validation, idempotency_key and expected_etag preconditions, deadline and MAX_INPUT_BYTES limits, snapshot-without-generation refusal, and declared-code normalisation. Tests: gateway::tests (7) + tests/gateway_matrix.rs every_operation_is_dispatched_and_returns_only_declared_codes (all 69 ops), deadlines_and_input_limits_are_enforced_before_the_handler, idempotency_keys_are_required_where_the_registry_declares_them, expected_etag_is_required_where_the_registry_declares_it, snapshot_reads_must_name_a_generation.'
    blocked_reason: null
  - id: P8-WP2
    status: done
    evidence: 'OpContext is injected by the gateway after a host-supplied ScopeResolver; the envelope scopes are expectations only and a forged envelope scope is refused (tests/gateway_matrix.rs a_forged_envelope_scope_does_not_grant_authority). Deny-by-default require() per declared scope; 40.7 visibility rule maps a foreign tenant/project to NOT_FOUND (a_stored_episode_is_readable_only_inside_its_scope, a_foreign_scope_write_is_denied_without_leaking_existence) and visibility()/visibility_error() encode Visible/Forbidden/Hidden.'
    blocked_reason: null
  - id: P8-WP3
    status: done
    evidence: 'crates/ukma-mcp/src/manifest.rs projects 69 tools (65 domain + 4 system) from OPERATIONS with no drift (drift() empty, manifest_json() + DOMAIN_OPERATION_COUNT/SYSTEM_OPERATION_COUNT); handlers.rs registers all 69 (unhandled() empty, registered()==69); system.capabilities/get_operation/get_job/cancel_job implemented with a tenant+project scoped JobIndex. Tests: manifest::tests (5), handlers::tests (3), gateway_matrix the_manifest_is_projected_from_the_registry_without_drift, the_system_operations_describe_the_registry, a_job_is_visible_only_inside_its_tenant_and_project.'
    blocked_reason: null
  - id: P8-WP4
    status: done
    evidence: 'REST projection in crates/ukma-mcp/src/rest.rs (POST for every operation, GET only /api/v1/health and /api/v1/jobs/{id}); typed SDK in src/sdk.rs (Transport port + InProcess + Client::invoke/typed + system helpers) and apps/ukma-server (Server::handle -> status+envelope, --manifest/--health/--operations, std::net HTTP/1.1 listener) and crates/ukma-cli (health/capabilities/tools/routes/describe/manifest/call). Evidence: 10 tests in apps/ukma-server/tests/http.rs, 12 in crates/ukma-cli, 57 in ukma-mcp; live probe: GET /api/v1/health 200, POST /api/v1/system/capabilities 200, GET /api/v1/jobs/job-1 404 JOB_NOT_FOUND; cargo run -p ukma-cli -- tools => total=69.'
    blocked_reason: null
  - id: P8-WP5
    status: done
    evidence: 'crates/ukma-mcp/src/alias.rs: AliasTable is inert by default (zero entries, is_enabled()=false, resolve()=None), enable() requires the pinned upstream commit 590c2ca7dd7b37bd1d41caf45fac535b6522f969 plus a non-empty parity test plus a registered target operation, and difference_matrix_json() reports alias_count=0 with enabled=false - no compatibility is claimed. Tests: gateway_matrix the_codegraph_alias_layer_is_inert_and_unclaimed.'
    blocked_reason: null
